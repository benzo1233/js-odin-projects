<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO's</title>
</head>

<body>
    <div id="sidebar">
        <button id="addTask">Add Task [ + ]</button>
        <dialog id="todo-dialog">
            <h2>Create To-Do</h2>
            <form id="todo-form">
                <!-- // Title, Description, dueDate, Priority (1-5?), notes/checklist -->
                <label for="title"></label>
                <input type="text" id="title" placeholder="Enter a title" required>

                <label for="description"></label>
                <input type="text" id="description" placeholder="Enter a Description" required>

                <label for="duedate"></label>
                <input type="datetime-local" id="duedate" placeholder="Enter a Due Date" required>

                <div>
                    <label for="priority">Priority: </label>
                    <input type="number" id="priority" placeholder="Select Priority" min="1" max="3" step="1" value="1" required>

                </div>

                <label for="notes"></label>
                <input type="text" id="notes" placeholder="Notes" required>

                <button type="submit">Submit</button>
                <button type="button" id="closeBtn">Cancel</button>
            </form>
        </dialog>

        <button id="addProject">Add Projects [ + ]</button>

    </div>

    <div id="container">

    </div>
</body>

</html>
