<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="hero">
            <div class="hero-area">
                <img src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png"
                    alt="nah">
                <h1 class="hero-text">Odin</h1>
            </div>
        </div>
    </header>

    <div class="wrapper">
        <main>
            <div class="hero-des">
                <p>
                    This is not a real online service. You know you need something like this in your life to help you
                    realize
                    your deepest dreams.
                    You know you want to.
                </p>
                <p>
                    Sign up <span style="font-style: italic">now</span> to get started.
                </p>
                <p>
                    You <span style="font-style: italic">know</span> you want to.
                </p>
            </div>

            <form id="form" action="" method="post">
                <p class="Nike">Lets do this!</p>
                <div class="first">
                    <label for="first-name">FIRST NAME: </label>
                    <input type="text" id="first-name" required>
                </div>
                <div class="last">
                    <label for="last-name">LAST NAME: </label>
                    <input type="text" id="last-name" required>
                </div>
                <div class="email">
                    <label for="email">EMAIL: </label>
                    <input type="email" id="email" required>
                </div>
                <div class="tele">
                    <label for="tel">PHONE NUMBER: </label>
                    <input type="tel" id="tel" required>
                </div>
                <div class="pswd">
                    <label for="pswd">PASSWORD</label>
                    <input type="password" id="pswd" required>
                </div>
                <div class="confirm-pswd">
                    <label for="confirm-pswd">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-pswd" required>
                </div>
            </form>
        </main>
        <footer>
            <div>
                <button class="btn" type="submit" form="form">Create Account</button>
                <p>Already have an account? <span style="color: #596D48; font-weight: bold;">Login</span></p>
            </div>
        </footer>
    </div>
</body>

</html>
