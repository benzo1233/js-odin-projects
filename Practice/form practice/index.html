    <h1>Payment Form</h1>
    <p>Complete all (*) Forms</p>

    <!-- Section 1 -->
    <section>
        <h2>Contact information</h2>
        <fieldset>
            <legend>Title</legend>
            <ul>
                <li>
                    <label for="title_1">
                        <input type="radio" id="title_1" name="title" value="A" />
                        Ace
                    </label>
                </li>
                <li>
                    <label for="title_2">
                        <input type="radio" id="title_2" name="title" value="K" />
                        King
                    </label>
                </li>
                <li>
                    <label for="title_3">
                        <input type="radio" id="title_3" name="title" value="Q" />
                        Queen
                    </label>
                </li>
            </ul>
        </fieldset>
        <p>
            <label for="name">Name *:</label>
            <input type="text" id="name" name="username" required />
        </p>
        <p>
            <label for="mail">Email *:</label>
            <input type="email" id="mail" name="user-mail" required />
        </p>
        <p>
            <label for="pwd">Password *:</label>
            <input type="password" id="pwd" name="password" required />
        </p>
    </section>


    <label for="party">Choose a date and time for your party:</label>
    <input type="search" id="party" name="bday" />


    <!-- Section 2 -->
    <section>
        <h2>Payment information</h2>
        <p>
            <label for="card">Card type:</label>
            <select id="card" name="user-card">
                <option value="visa">Visa</option>
                <option value="mc">Mastercard</option>
                <option value="amex">American Express</option>
            </select>
        </p>
        <p>
            <label for="number">Card number *:</label>
            <input type="tel" id="number" name="card-number" required />
        </p>
        <p>
            <label for="expiration">Expiration date *:</label>
            <input type="text" id="expiration" name="expiration" required placeholder="MM/YY"
                pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$" />
        </p>
    </section>
    <input type="file" multiple>
    <!-- <label for="email">Enter Email: </label> -->
    <!-- <input type="email" id="email" name="email" multiple /> -->
    <input type="range" min="1" max="50" step="1" value="20" id="num" name="num" />
    <output class="price-output" for="num"></output>

    <section>
        <p>
            <button type="submit">Validate the payment</button>
            <input type="hidden" id="timestamp" name="timestamp" value="1286705410" />
        </p>
    </section>


    <script>
        const price = document.querySelector("#num");
        const output = document.querySelector(".price-output");

        output.textContent = price.value;

        price.addEventListener("input", () => {
            output.textContent = price.value;
        }); 
    </script>
